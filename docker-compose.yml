version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: order_to_audit_db
    restart: always
    environment:
      POSTGRES_DB: order_to_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init-docker:/docker-entrypoint-initdb.d
    networks:
      - erp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_to_audit_app
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      API_PREFIX: /api/v1
      CORS_ORIGIN: "http://localhost:3000,http://localhost:5000"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order_to_audit
      DB_USER: postgres
      DB_PASSWORD: postgres_secure_password_2026
      JWT_SECRET: order_to_audit_jwt_secret_key_2026_super_secure_phase2
      JWT_EXPIRES_IN: 24h
      BCRYPT_SALT_ROUNDS: 10
    ports:
      - "5000:5000"
    networks:
      - erp-network

volumes:
  pgdata:

networks:
  erp-network:
    driver: bridge
