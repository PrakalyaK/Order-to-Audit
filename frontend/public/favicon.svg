<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Enterprise Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Factory / Production Facility with Roofline & Chimneys -->
  <path d="M12 43V26L21 32V25L30 31V18H41V43H12Z" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <!-- Grain Silo / Storage Tank -->
  <rect x="43" y="24" width="9" height="19" rx="3" fill="#e0e7ff" fill-opacity="0.9"/>
  <!-- Silo Dome -->
  <path d="M43 24C43 21.5 45 19.5 47.5 19.5C50 19.5 52 21.5 52 24H43Z" fill="#c7d2fe"/>

  <!-- Steam / Production Activity Puffs -->
  <circle cx="36" cy="12" r="2.2" fill="#a5b4fc" fill-opacity="0.85"/>
  <circle cx="37.5" cy="7.5" r="1.6" fill="#c7d2fe" fill-opacity="0.7"/>

  <!-- Golden Audit Compliance Badge (Bottom Right) -->
  <circle cx="45" cy="45" r="13" fill="#0f172a"/>
  <circle cx="45" cy="45" r="11" fill="url(#goldGrad)"/>
  <circle cx="45" cy="45" r="9" fill="url(#emeraldGrad)"/>
  <!-- Crisp Checkmark -->
  <path d="M41 45.2L43.8 48L49 42.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
